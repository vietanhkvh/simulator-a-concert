<!doctype html><html><body style="margin:0;background:#000">
<script type="module">
import * as THREE from 'three';
import { createUfo } from '/src/zones/outside/secretUfo.ts';
import { createRocket } from '/src/zones/outside/secretRocket.ts';
import { ROOF, STANDS_R_INNER, STANDS_R_OUTER, STADIUM_CENTRE } from '/src/world/layout.ts';
const W = 960, H = 540;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14102b);
scene.fog = new THREE.Fog(0x2a2350, 60, 400);
const box = (w,h,d,x,y,z,c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x,y,z); scene.add(m); };
box(ROOF.halfW*2, 1, ROOF.zBack-ROOF.zFront, 0, ROOF.yMax, (ROOF.zBack+ROOF.zFront)/2, 0x3a3060);
box(400, 0.2, 400, 0, -0.1, -40, 0x1d1838);
const ring = new THREE.Mesh(new THREE.RingGeometry(STANDS_R_INNER, STANDS_R_OUTER, 64, 1, -0.72*Math.PI - Math.PI/2, 1.44*Math.PI), new THREE.MeshBasicMaterial({ color: 0x2f2858, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI/2; ring.position.set(STADIUM_CENTRE.x, 18, STADIUM_CENTRE.z); scene.add(ring);
const acts = { ufo: createUfo(scene), rocket: createRocket(scene) };
const cam = new THREE.PerspectiveCamera(55, W/H, 0.1, 1000);
window.shot = (kind, t, mode) => {
  for (const k in acts) acts[k].stop();
  const act = acts[kind]; act.start();
  const f = { dt: 1/60, songTime: t, beat: t*2, beatPulse: 0.3, level: 0.6, hype: 0.92, waveMode: 1, pitch: null, activeNote: null, lineIndex: 0, score: {} };
  act.update(t, f);
  const focus = new THREE.Vector3(...(kind === 'ufo' ? [0,18,-40] : [0,50,-20]));
  if (act.focus) act.focus(t, focus);
  scene.updateMatrixWorld(true);
  let obj = null;
  scene.traverse((o) => { if (!obj && o.isMesh && o.material.uniforms && o.material.uniforms.uBlink && o.material.uniforms.uOutline.value === 0 && o.parent && o.visible) obj = o; });
  const op = new THREE.Vector3(); if (obj) obj.getWorldPosition(op);
  if (mode === 'singer') { cam.fov = 55; cam.position.set(0,1.65,0); cam.lookAt(focus); }
  else if (mode === 'over') { cam.fov = 55; cam.position.set(0,62,-112); cam.lookAt(focus); }
  else { cam.fov = 40; const d = new THREE.Vector3(0,1.65,0).sub(op).setY(0).normalize(); cam.position.copy(op).addScaledVector(d, mode === 'close2' ? 22 : 13); cam.position.y += (kind==='ufo'?5:1); cam.lookAt(op.x, op.y + (kind==='ufo'?1.5:0), op.z); }
  cam.updateProjectionMatrix();
  r.render(scene, cam);
  return r.info.render.calls;
};
window.ready = true;
</script></body></html>
