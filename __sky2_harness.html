<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import * as THREE from 'three';
import { createSky, triggerMeteors } from '/src/zones/outside/sky.ts';
import { createWorldUniforms } from '/src/world/shared/worldUniforms.ts';
import { createGlowBuf, buildGlowPoints } from '/src/world/shared/glowPoints.ts';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(1280, 720, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0a1c);
const camera = new THREE.PerspectiveCamera(70, 1280/720, 0.1, 220);
camera.position.set(0, 1.65, 0); camera.rotation.order = 'YXZ'; camera.rotation.x = THREE.MathUtils.degToRad(25);
const u = createWorldUniforms(); const glow = createGlowBuf();
const sky = createSky(scene, u, glow); buildGlowPoints(scene, u, glow);
let t = 0;
window.H = {
  hype(h){ u.uHype.value = h; },
  step(sec, dt=1/30){ for (let k=0;k<sec/dt;k++){ t+=dt; u.uTime.value=t; sky.update(t);} },
  render(){ renderer.render(scene, camera); return renderer.info.render.calls; },
  aim(yawDeg, pitchDeg, fov=70){ camera.rotation.y=THREE.MathUtils.degToRad(yawDeg); camera.rotation.x=THREE.MathUtils.degToRad(pitchDeg); camera.fov=fov; camera.updateProjectionMatrix(); },
  aimAt(i,fov){ const v=u.uPlane.value[i]; camera.fov=fov; camera.updateProjectionMatrix(); camera.lookAt(v.x,v.y,v.z); return H.render(); },
  meteors(n){ triggerMeteors(n); },
  plane(){ return u.uPlane.value.map(v=>v.toArray()); },
  t(){return t;},
};
window.ready = true;
</script></body></html>
